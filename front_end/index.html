<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-dark custom-navbar mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand brand-title d-flex align-items-center gap-2">
                Expense Tracker
            </span>
            <!-- Dark Mode Toggle Button -->
            <button id="darkModeToggle" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-moon-fill" viewBox="0 0 16 16">
                <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
                </svg>
            </button>
        </div>
    </nav>

    <div class="container pb-5">
        <!-- Alert Box for Error Handling -->
        <div id="alertContainer"></div>

        <!-- Summary Cards Section -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="summary-card">
                    <div class="card-label">Total Amount</div>
                    <h3 class="card-value" id="totalAmount">$0.00</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-card">
                    <div class="card-label">Total Expenses</div>
                    <h3 class="card-value" id="totalCount">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-card">
                    <div class="card-label">Highest Expense</div>
                    <h3 class="card-value" id="highestExpense">$0.00</h3>
                </div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="custom-table-container p-4">
                    <h5 class="fw-bold mb-3" style="color: var(--burgundy-primary);">Expenses by Category</h5>
                    <div style="max-height: 320px; position: relative;">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Bar: Add & Filter -->
        <div class="row g-3 mb-4 align-items-center justify-content-between">
            <div class="col-auto">
                <button class="btn btn-burgundy d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#expenseModal" onclick="prepareAddModal()">
                    <span>+</span> Add New Expense
                </button>
            </div>
            <div class="col-auto d-flex align-items-center gap-2">
                <label for="filterCategory" class="fw-semibold text-muted mb-0 small">Filter:</label>
                <select id="filterCategory" class="form-select shadow-sm" style="min-width: 170px;">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center my-5 d-none">
            <div class="spinner-border text-danger" role="status" style="color: var(--burgundy-primary) !important;">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Expense Table Container -->
        <div class="custom-table-container">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expensesTableBody">
                        <!-- Dynamic JS Content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <div class="modal fade" id="expenseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold" id="expenseModalLabel" style="color: var(--burgundy-primary);">Add Expense</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="expenseForm">
                        <input type="hidden" id="expenseId">
                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold small">Title</label>
                            <input type="text" class="form-control" id="title" placeholder="e.g., Flowers, Coffee" required>
                        </div>
                        <div class="mb-3">
                            <label for="amount" class="form-label fw-semibold small">Amount ($)</label>
                            <input type="number" step="0.01" class="form-control" id="amount" placeholder="0.00" required min="0.01">
                        </div>
                        <div class="mb-3">
                            <label for="category" class="form-label fw-semibold small">Category</label>
                            <select class="form-select" id="category" required>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="date" class="form-label fw-semibold small">Date</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-burgundy" id="saveBtn">Save Expense</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
